  <div id="root" data-composition-id="captions-layer" data-width="1920" data-height="1080">
    <div id="cap-01-clip" class="clip cap-slot" data-start="0.68" data-duration="2.96">
      <div id="cap-01" class="cap-box"><span class="cap-text">What happens to people who never heard of Jesus?</span></div>
    </div>
    <div id="cap-02-clip" class="clip cap-slot" data-start="3.76" data-duration="2.39">
      <div id="cap-02" class="cap-box"><span class="cap-text">If Jesus is the only way to the Father,</span></div>
    </div>
    <div id="cap-03-clip" class="clip cap-slot" data-start="6.27" data-duration="5.08">
      <div id="cap-03" class="cap-box"><span class="cap-text">what about a man born in a remote village who died without ever hearing his name?</span></div>
    </div>
    <div id="cap-04-clip" class="clip cap-slot" data-start="11.48" data-duration="4.63">
      <div id="cap-04" class="cap-box"><span class="cap-text">People ask this in our comments all the time&lt;br/&gt;so let the Bible answer it.</span></div>
    </div>
    <div id="cap-05-clip" class="clip cap-slot" data-start="17.98" data-duration="4.39">
      <div id="cap-05" class="cap-box"><span class="cap-text">The Bible's clearest window into this is a man named Cornelius.</span></div>
    </div>
    <div id="cap-06-clip" class="clip cap-slot" data-start="22.49" data-duration="4.17">
      <div id="cap-06" class="cap-box"><span class="cap-text">He was a Roman centurion in Caesarea — a Gentile, not a Jew.</span></div>
    </div>
    <div id="cap-07-clip" class="clip cap-slot" data-start="26.78" data-duration="4.96">
      <div id="cap-07" class="cap-box"><span class="cap-text">Yet he feared God, gave generously to the poor, and prayed continually.</span></div>
    </div>
    <div id="cap-08-clip" class="clip cap-slot" data-start="33.68" data-duration="3.78">
      <div id="cap-08" class="cap-box"><span class="cap-text">One afternoon, an angel appeared to him with a command:</span></div>
    </div>
    <div id="cap-09-clip" class="clip cap-slot" data-start="37.58" data-duration="3.35">
      <div id="cap-09" class="cap-box"><span class="cap-text">send to Joppa, and bring a man named Simon Peter.</span></div>
    </div>
    <div id="cap-10-clip" class="clip cap-slot" data-start="41.05" data-duration="7.18">
      <div id="cap-10" class="cap-box"><span class="cap-text">When Peter arrived and preached the gospel&lt;br/&gt;the Holy Spirit fell on Cornelius and his entire household,</span></div>
    </div>
    <div id="cap-11-clip" class="clip cap-slot" data-start="48.36" data-duration="2.93">
      <div id="cap-11" class="cap-box"><span class="cap-text">before a single Jewish ritual was required.</span></div>
    </div>
    <div id="cap-12-clip" class="clip cap-slot" data-start="51.40" data-duration="4.28">
      <div id="cap-12" class="cap-box"><span class="cap-text">The first Gentile converts — reached exactly where they stood.</span></div>
    </div>
    <div id="cap-13-clip" class="clip cap-slot" data-start="57.60" data-duration="2.85">
      <div id="cap-13" class="cap-box"><span class="cap-text">Then Peter said something extraordinary.</span></div>
    </div>
    <div id="cap-14-clip" class="clip cap-slot" data-start="60.57" data-duration="2.18">
      <div id="cap-14" class="cap-box"><span class="cap-text">God is no respecter of persons.</span></div>
    </div>
    <div id="cap-15-clip" class="clip cap-slot" data-start="62.88" data-duration="6.05">
      <div id="cap-15" class="cap-box"><span class="cap-text">But in every nation, he that fears him and does what is right is accepted with him.</span></div>
    </div>
    <div id="cap-16-clip" class="clip cap-slot" data-start="69.05" data-duration="4.41">
      <div id="cap-16" class="cap-box"><span class="cap-text">That is answer one. God is not waiting for perfect knowledge.</span></div>
    </div>
    <div id="cap-17-clip" class="clip cap-slot" data-start="73.58" data-duration="5.31">
      <div id="cap-17" class="cap-box"><span class="cap-text">He moves toward anyone reaching for him&lt;br/&gt;even through the faintest light.</span></div>
    </div>
    <div id="cap-18-clip" class="clip cap-slot" data-start="80.50" data-duration="3.00">
      <div id="cap-18" class="cap-box"><span class="cap-text">Answer two: no one is truly without light.</span></div>
    </div>
    <div id="cap-19-clip" class="clip cap-slot" data-start="83.62" data-duration="4.79">
      <div id="cap-19" class="cap-box"><span class="cap-text">Paul says the eternal power of God is visible in what he has made.</span></div>
    </div>
    <div id="cap-20-clip" class="clip cap-slot" data-start="88.53" data-duration="1.81">
      <div id="cap-20" class="cap-box"><span class="cap-text">Every sunrise declares it.</span></div>
    </div>
    <div id="cap-21-clip" class="clip cap-slot" data-start="90.46" data-duration="3.97">
      <div id="cap-21" class="cap-box"><span class="cap-text">He writes that the law is written on every human heart.</span></div>
    </div>
    <div id="cap-22-clip" class="clip cap-slot" data-start="94.55" data-duration="5.01">
      <div id="cap-22" class="cap-box"><span class="cap-text">And in Athens, standing before a pillar inscribed to the unknown God,</span></div>
    </div>
    <div id="cap-23-clip" class="clip cap-slot" data-start="99.68" data-duration="6.49">
      <div id="cap-23" class="cap-box"><span class="cap-text">Paul said the God they were already groping after is the God he had been sent to declare.</span></div>
    </div>
    <div id="cap-24-clip" class="clip cap-slot" data-start="108.42" data-duration="5.25">
      <div id="cap-24" class="cap-box"><span class="cap-text">Which brings answer three: God judges fairly&lt;br/&gt;by the light each person was given.</span></div>
    </div>
    <div id="cap-25-clip" class="clip cap-slot" data-start="113.79" data-duration="3.79">
      <div id="cap-25" class="cap-box"><span class="cap-text">To whomsoever much is given, of him shall much be required.</span></div>
    </div>
    <div id="cap-26-clip" class="clip cap-slot" data-start="117.70" data-duration="5.12">
      <div id="cap-26" class="cap-box"><span class="cap-text">And if a city as broken as Sodom could be spared for the sake of ten righteous,</span></div>
    </div>
    <div id="cap-27-clip" class="clip cap-slot" data-start="122.93" data-duration="3.53">
      <div id="cap-27" class="cap-box"><span class="cap-text">how much more does the judge of all the earth do right?</span></div>
    </div>
    <div id="cap-28-clip" class="clip cap-slot" data-start="128.38" data-duration="3.10">
      <div id="cap-28" class="cap-box"><span class="cap-text">Christians still disagree on how this plays out:</span></div>
    </div>
    <div id="cap-29-clip" class="clip cap-slot" data-start="131.60" data-duration="4.58">
      <div id="cap-29" class="cap-box"><span class="cap-text">whether the gospel must be consciously heard and trusted in this life,</span></div>
    </div>
    <div id="cap-30-clip" class="clip cap-slot" data-start="136.30" data-duration="3.91">
      <div id="cap-30" class="cap-box"><span class="cap-text">or whether Christ can save those who never learned his name.</span></div>
    </div>
    <div id="cap-31-clip" class="clip cap-slot" data-start="140.33" data-duration="4.91">
      <div id="cap-31" class="cap-box"><span class="cap-text">But every view agrees on one thing&lt;br/&gt;there is no salvation outside of Jesus.</span></div>
    </div>
    <div id="cap-32-clip" class="clip cap-slot" data-start="145.36" data-duration="2.30">
      <div id="cap-32" class="cap-box"><span class="cap-text">No other name is given under heaven.</span></div>
    </div>
    <div id="cap-33-clip" class="clip cap-slot" data-start="149.66" data-duration="4.16">
      <div id="cap-33" class="cap-box"><span class="cap-text">Then Paul asks a question that puts the weight back on our shoulders.</span></div>
    </div>
    <div id="cap-34-clip" class="clip cap-slot" data-start="153.94" data-duration="3.47">
      <div id="cap-34" class="cap-box"><span class="cap-text">How shall they call on him in whom they have not believed?</span></div>
    </div>
    <div id="cap-35-clip" class="clip cap-slot" data-start="157.53" data-duration="3.72">
      <div id="cap-35" class="cap-box"><span class="cap-text">And how shall they believe in him of whom they have not heard?</span></div>
    </div>
    <div id="cap-36-clip" class="clip cap-slot" data-start="161.37" data-duration="2.54">
      <div id="cap-36" class="cap-box"><span class="cap-text">And how shall they hear without a preacher?</span></div>
    </div>
    <div id="cap-37-clip" class="clip cap-slot" data-start="164.04" data-duration="2.54">
      <div id="cap-37" class="cap-box"><span class="cap-text">The answer to the village of no name is us.</span></div>
    </div>
  </div>
